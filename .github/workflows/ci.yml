name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Function hooks are early access and may change between Claude Code
  # releases: a weekly run against the latest one catches a release that
  # breaks the plugin before someone installing it does.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      # latest, not stable: function hooks need 2.1.280+, which the stable
      # dist-tag can trail.
      - run: npm install -g @anthropic-ai/claude-code@latest typescript
      - run: claude --version
      - name: Test the pure logic
        run: bun test tests
      - name: Test the hooks
        run: claude plugin test plugins/md-prompt
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate the plugin
        run: claude plugin validate plugins/md-prompt
      # Loading the plugin in a session is what writes the type declarations of this Claude Code
      # build and a tsconfig.json next to it (validate and test do not). /cost is a local command:
      # no model call, and it runs without a login.
      - name: Write the type declarations
        run: claude -p "/cost" --plugin-dir plugins/md-prompt
      - name: Type-check the plugin
        run: tsc -p plugins/md-prompt
